name: Build data

# Rebuilds the Spain and Aragón artifacts from the Portolan mirror of NASA FIRMS and
# opens (or updates) a pull request into develop with the result.
#
# Runs on its own when the pipeline, the regions or this file change on develop, and
# by hand from the Actions tab once this file is also on the default branch.
# The data commit only touches data/processed, apps/web/public/data and docs/img, so
# merging it never triggers this workflow again.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "pipeline/**"
      - "data/regions.json"
      - "data/aoi/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-data
  cancel-in-progress: false

env:
  DATA_BRANCH: data/auto-build

jobs:
  build:
    name: Ingest, harmonize, export
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            services/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r pipeline/requirements.txt -r services/api/requirements.txt

      # A pull request opened by this workflow does not start the CI workflow, so the
      # same tests run here before anything is committed.
      - name: Run pipeline tests
        run: |
          python -m pipeline.tests.test_firms
          python -m pipeline.tests.test_regions
          python -m pipeline.tests.test_normalize
          python -m pipeline.tests.test_harmonize
          python -m pipeline.tests.test_payloads

      - name: Ingest from the Portolan mirror
        run: |
          # Resumable per region and year: a retry only fetches what failed.
          for attempt in 1 2 3; do
            if python -m pipeline.firms spain aragon; then exit 0; fi
            echo "::warning::ingest attempt $attempt failed, retrying"
            sleep 30
          done
          exit 1

      - name: Harmonize
        run: |
          python -m pipeline.harmonize spain | tee harmonize-spain.log
          python -m pipeline.harmonize aragon --prior-region spain | tee harmonize-aragon.log

      - name: Export for the web and redraw the figures
        run: |
          python -m pipeline.export_web
          python -m pipeline.charts

      - name: Check the exported files
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          web = Path("apps/web/public/data")
          ids = [r["id"] for r in json.loads((web / "regions.json").read_text(encoding="utf-8"))]
          assert ids == ["spain", "aragon"], ids
          lines = ["| Region | Months | Years | Detections (CSV) | Blind test | Raw VIIRS |", "|---|---|---|---|---|---|"]
          for rid in ids:
              cal = json.loads((web / "calendar" / f"{rid}.json").read_text(encoding="utf-8"))
              method = json.loads((web / "method" / f"{rid}.json").read_text(encoding="utf-8"))
              months = sum(v is not None for row in cal["harmonized"] for v in row)
              assert months > 250, (rid, months)
              files = sorted((web / "detections" / rid).glob("*.csv"))
              assert files, rid
              rows = sum(max(0, len(f.read_text(encoding="utf-8").splitlines()) - 1) for f in files)
              blind = method["validation"].get("holdout") or {}
              lines.append(
                  f"| {rid} | {months} | {cal['years'][0]} to {cal['years'][-1]} | {rows:,} | "
                  f"{blind.get('error_pct')} % | {blind.get('raw_error_pct')} % |"
              )
          summary = "\n".join(lines) + "\n"
          print(summary)
          Path("data-summary.md").write_text(summary, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Built data\n\n" + summary)
          EOF

      - name: Drop the Iberia artifacts
        run: git rm -q --ignore-unmatch data/processed/method.json data/processed/calendar/iberia.parquet data/processed/hotspots/iberia.parquet

      - name: Keep a copy of the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firetrack-data
          path: |
            data/processed
            apps/web/public/data
            docs/img
            harmonize-*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$DATA_BRANCH"
          git add -A data/processed apps/web/public/data docs/img
          if git diff --cached --quiet; then
            echo "The data did not change; nothing to commit."
            exit 0
          fi
          git commit -q -m "data: Spain and Aragon artifacts from the Portolan mirror" \
            -m "Built by the Build data workflow, run ${GITHUB_RUN_ID}, from ${GITHUB_SHA}."
          git push --force origin "$DATA_BRANCH"

          {
            echo "Built by [Build data run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from \`${GITHUB_SHA::7}\`. Pipeline tests passed in that run."
            echo
            cat data-summary.md
            echo
            echo "Harmonizer output:"
            echo
            echo '```'
            grep -hE "^(region|clip|calibration|median|step|blind)" harmonize-spain.log harmonize-aragon.log
            echo '```'
            echo
            echo "Also removes the Iberia artifacts, which no configured region uses any more."
          } > pr-body.md

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/develop...${DATA_BRANCH}?expand=1"
          if [ "$(gh pr view "$DATA_BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            echo "The open data pull request was updated."
          elif gh pr create --base develop --head "$DATA_BRANCH" \
                 --title "data: Spain and Aragón artifacts from the Portolan mirror" --body-file pr-body.md; then
            echo "Opened the data pull request."
          else
            echo "::warning::Could not open the pull request (the repository may not allow GitHub Actions to create pull requests). Open it by hand: $compare"
            printf '\nOpen the pull request by hand: %s\n' "$compare" >> "$GITHUB_STEP_SUMMARY"
          fi
